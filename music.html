<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHABAND – Music & Quran</title><style>body{background:#191713;color:#f3e6c1;font:16px system-ui;margin:0}main{max-width:640px;margin:auto;padding:20px}h1,a{color:#d4af37}section{border:1px solid #806735;border-radius:14px;padding:16px;margin:14px 0;background:#252119}input,select,button{box-sizing:border-box;font:inherit;padding:12px;border:1px solid #806735;border-radius:9px;background:#191713;color:#f3e6c1;margin:5px 0}input,select,audio{width:100%}button{cursor:pointer}label{display:block}small{color:#c8bfa9}audio{margin-top:12px}a{display:inline-block;padding:8px}</style></head><body><main><a href="index.html" target="_blank" rel="noopener">⌂ سەرەکی / یاری</a><h1>♫ میوزیک و قورئان</h1><section><label for="q">گەڕان بۆ گۆرانی یان قورئان</label><input id="q" type="search" placeholder="ناوی گۆرانی، هونەرمەند، قاری"><button id="yt">YouTube ↗</button> <button id="sp">Spotify ↗</button><p><small>گەڕان لە سەرچاوەی فەرمی لە تابێکی تر دەکرێت؛ دەنگی YouTube لێرە جیا ناکرێتەوە.</small></p></section><section><h2>پلەیەری دەنگ</h2><label for="local">فایلی دەنگی خۆت</label><input id="local" type="file" accept="audio/*"><label for="url">لینکی ڕاستەوخۆی دەنگی مۆڵەتپێدراو (HTTPS)</label><input id="url" type="url" dir="ltr" placeholder="https://…/audio.mp3"><button id="load">بارکردنی دەنگ</button><audio id="player" controls preload="none"></audio><button id="play">▶ Play</button> <button id="pause">Ⅱ Pause</button><p id="status" role="status" aria-live="polite"></p><small>ئەم تابە کراوە بهێڵەوە و لە تابێکی تر یاری بکە. بەردەوامی دەنگ بە سیستەمی مۆبایلەکەتەوە بەستراوە.</small></section></main><script src="music.js"></script></body></html>
