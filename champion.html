<!doctype html><html lang="ckb" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHABAND | Winner Stays</title><style>body{background:#171610;color:#eee;font:16px system-ui;margin:16px}main{max-width:560px;margin:auto}h1,h2{color:#d4af37}section{background:#242118;border:1px solid #66532d;border-radius:14px;padding:16px;margin:12px 0}button,input,select,a{font:inherit;color:#eee;background:#30291b;border:1px solid #80682f;border-radius:8px;padding:10px;margin:4px}button:disabled{opacity:.45}#board{display:grid;grid-template-columns:repeat(8,1fr);direction:ltr;aspect-ratio:1}#board button{margin:0;padding:0;border:0;border-radius:0;font-size:clamp(22px,7vw,44px);color:#111}#board button.sel{outline:3px solid gold;z-index:1}#chat{max-height:150px;overflow:auto} [hidden]{display:none!important}#board{display:grid;width:100%;aspect-ratio:1/1;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));direction:ltr}#board>*{width:100%;height:100%;min-height:0;min-width:0;padding:0;margin:0;box-sizing:border-box;display:grid;place-items:center}#board button{transition:filter .15s}#board button:active{filter:brightness(1.2)}#motion{position:fixed;inset:0;z-index:99;display:grid;place-content:center;text-align:center;background:#171610ed;color:#d4af37;font-size:2rem;pointer-events:none;animation:entrance .65s both}@keyframes entrance{0%{opacity:0;transform:scale(1.08)}25%,65%{opacity:1;transform:scale(1)}100%{opacity:0}}@media(prefers-reduced-motion:reduce){#motion{display:none!important}} </style><main><a href="online.html">‹ ئۆنلاین</a><h1>🏆 ژووری پاڵەوان</h1><p id="status">چاوەڕوانی ئەکاونت...</p><section id="setup"><select id="time"><option>3+2</option><option>5+3</option><option>10+0</option></select><select id="visibility"><option value="public">گشتی</option></select><button id="create">دروستکردنی ژوور</button><input id="code" placeholder="کۆدی ژوور"><button id="join">چوونە ژوور</but
