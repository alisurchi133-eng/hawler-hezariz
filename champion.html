<!doctype html><html lang="ckb" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHABAND | Winner Stays</title><style>body{background:#171610;color:#eee;font:16px system-ui;margin:16px}main{max-width:560px;margin:auto}h1,h2{color:#d4af37}section{background:#242118;border:1px solid #66532d;border-radius:14px;padding:16px;margin:12px 0}button,input,select,a{font:inherit;color:#eee;background:#30291b;border:1px solid #80682f;border-radius:8px;padding:10px;margin:4px}button:disabled{opacity:.45}#board{display:grid;grid-template-columns:repeat(8,1fr);direction:ltr;aspect-ratio:1}#board button{margin:0;padding:0;border:0;border-radius:0;font-size:clamp(22px,7vw,44px);color:#111}#board button.sel{outline:3px solid gold;z-index:1}#chat{max-height:150px;overflow:auto} [hidden]{display:none!important}</style><main><a href="online.html">‹ ئۆنلاین</a><h1>🏆 ژووری پاڵەوان</h1><p id="status">چاوەڕوانی ئەکاونت...</p><section id="setup"><select id="time"><option>3+2</option><option>5+3</option><option>10+0</option></select><select id="visibility"><option value="public">گشتی</option></select><button id="create">دروستکردنی ژوور</button><input id="code" placeholder="کۆدی ژوور"><button id="join">چوونە ژوور</button><h2>ژوورە گشتییەکان</h2><div id="publicRooms"></div></section><section id="live" hidden><p id="roomCode"></p><button id="copy">کۆپی کۆد</button><button id="leave">دەرچوون</button><h2 id="top"></h2><div id="board"></div><h2 id="bottom"></h2><p id="result"></p><button id="resign">وازهێنان</button><button id="next">یاریی دواتر</button><h2>ڕیزی چاوەڕوانان</h2><ol id="queue"></ol><h2>چات</h2><div id="chat"></div><input id="message" maxlength="500"><button id="send">ناردن</button></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script type="module" src="champion.js?v=262"></script></html>
