<!doctype html><html lang="ckb" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHABAND Profile</title><style>body{background:#171610;color:#eee;font:16px system-ui;margin:16px}main{max-width:620px;margin:auto}section{background:#242117;border:1px solid #78622e;border-radius:14px;padding:16px;margin:12px 0}h1,h2,a{color:#d4af37}input,button{box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #92783d;background:#191810;color:#eee;margin:6px 0;max-width:100%}input{width:100%}button{cursor:pointer}small{color:#ccc}[hidden]{display:none!important}body{margin:0;padding:clamp(12px,4vw,32px);background:radial-gradient(ellipse at top,#302719,#171610 55%)}main{max-width:760px}section{padding:clamp(14px,3vw,24px);box-shadow:0 8px 24px #0003}h2{font-size:1.15rem;margin-top:0}button{min-height:44px}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #e8c65b;outline-offset:3px}.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.avatar{width:84px;height:84px;border-radius:50%;border:2px solid #d4af37;display:grid;place-items:center;font-size:36px;background:#191810;object-fit:cover}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.stats p{background:#191810;padding:14px;border-radius:10px;line-height:1.7;direction:ltr;text-align:center;margin:0}#email{overflow-wrap:anywhere}#delete{border-color:#a65d55;color:#ffb7ae}#status{min-height:1em} @media(max-width:420px){button{width:100%}.hero{justify-content:center;text-align:center}} </style><main><a href="index.html">⌂ سەرەکی</a><h1>👤 پەڕەی کەسی</h1><p id="status" role="status">چاوەڕوان بە…</p><section id="authPanel" hidden><h2>چوونەژوورەوە / دروستکردنی ئەکاونت</h2><button id="googleLogin" type="button">چوونەژوورەوە بە Google</button><form id="loginForm"><label>ئیمەیل<input id="loginEmail" type="email" autocomplete="email" required></label><label>وشەی نهێنی<input id="loginPassword" type="password" autocomplete="current-password" required></label><button type="submit">چوونەژوورەوە</button><button type="button" id="forgot">وشەی نهێنیم لەبیر چووە</button></form><details><summary>دروستکردنی ئەکاونتی نوێ</summary><form id="registerForm"><label>ناوی یاریزان<input id="regName" maxlength="50" required></label><label>ئیمەیل<input id="regEmail" type="email" autocomplete="email" required></label><label>وشەی نهێنی<input id="regPass" type="password" minlength="6" autocomplete="new-password" required></label><label>دووبارە وشەی نهێنی<input id="regConfirm" type="password" minlength="6" autocomplete="new-password" required></label><button type="submit">دروستکردنی ئەکاونت</button></form></details></section><div id="content" hidden><section><div class="hero"><img id="avatar" class="avatar" alt="وێنەی پرۆفایل" src="icon-192.png"><div><h2 id="playerTitle">ئەکاونت</h2><small>SHABAND · Erbil Chess KRD</small></div></div><label>وێنەی پرۆفایل (تەنها لەم ئامێرە)<input id="photo" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="removePhoto">لابردنی وێنە</button><p id="email"></p><p id="verified"></p><button id="verify">ناردنی نامەی پشتڕاستکردنەوە</button><button id="reset">گەڕاندنەوەی وشەی نهێنی</button><button id="delete">سڕینەوەی ئەکاونت</button><button id="logout">دەرچوون</button><button id="refresh">نوێکردنەوە</button><label>ناوی یاریزان<input id="name" maxlength="50"></label><button id="save">پاشەکەوتکردن</button></section><section><h2>ڕەیتینگی ئۆنلاین</h2><div id="ratings" class="stats"></div></section><section><h2>ڕاهێنان لەگەڵ کۆمپیوتەر</h2><small>تەنها لەم براوسەرە</small><div id="training" class="stats"></div></section><section><h2>مێژووی یاریی ئۆنلاین</h2><div id="history"></div></section><p><a href="friends.html">👥 هاوڕێکان</a></p><a href="leaderboard.html">🏆 پلەبەندی</a></div><p><a href="privacy.html">سیاسەتی تایبەتمەندی</a></p></main><script type="module" src="profile.js?v=303"></script></html>
