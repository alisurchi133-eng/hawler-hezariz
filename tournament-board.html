<!doctype html><html lang="ckb" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHABAND Tournament Board</title><style>*{box-sizing:border-box}body{margin:0;background:#17160f;color:#eee;font:16px system-ui}main{max-width:610px;margin:auto;padding:20px}h2,a{color:#d4af37}h2{text-align:center}.line{display:flex;justify-content:space-between;align-items:center;background:#211e13;border:1px solid #655329;border-radius:12px;padding:12px;margin:12px 0}.clock{font: bold 25px monospace;direction:ltr;background:#111;padding:8px;border-radius:8px}.active{color:#17160f;background:#d4af37}#board{display:grid;grid-template-columns:repeat(8,1fr);direction:ltr;border:5px solid #5a3a22;border-radius:10px;overflow:hidden}#board button{aspect-ratio:1;border:0;padding:0;font-size:clamp(24px,7vw,48px);font-family:'Segoe UI Symbol',sans-serif;line-height:1;cursor:pointer;color:#171717;text-shadow:0 0 1px #fff}.light{background:#e8d2aa}.dark{background:#986c45}.selected{box-shadow:inset 0 0 0 4px #eac52e}.target{box-shadow:inset 0 0 0 5px #6b943c}.white{color:#fff!important;text-shadow:0 0 2px #000,1px 1px #000!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,select{background:#211e13;color:#d4af37;border:1px solid #806b32;border-radius:9px;padding:12px;font:inherit}.actions button{flex:1}small{color:#bbb}#status{text-align:center;color:#d4af37}</style><main><a href="tournament.html">‹ گەڕانەوە بۆ پاڵەوانیەتی</a><h2>🏆 SHABAND Championship</h2><p style="text-align:center">خول ١ / ٦ · نموونەی ناوخۆیی · بێ ڕەیتینگ</p><label>کاتی یاری <select id="time"><option>10+5</option><option>3+2</option><option>5+3</option><option>10+0</option><option>15+10</option></select></label><div class="line"><div>♚ یاریزانی ڕەش<br><small>ڕەیتینگ: —</small></div><span class="clock" id="b">10:00</span></div><div id="board"></div><div class="line"><div>♔ یاریزانی سپی<br><small>ڕەیتینگ: —</small></div><span class="clock" id="w">10:00</span></div><p id="status" role="status"></p><div class="actions"><button id="start">دەستپێکردن / یاری نوێ</button><button id="flip">گۆڕینی لا</button><button id="resign">وازهێنان</button></div><p><small>تەنها تاقیکردنەوەی دوو یاریزان لە هەمان ئامێر. ئەنجام و ڕەیتینگ نانێردرێن بۆ Firebase.</small></p></main><script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script>
const $=id=>document.getElementById(id);if(typeof Chess==='undefined'){$('status').textContent='Chess engine could not load';}else{const game=new Chess(),pieces={p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚'};let selected=null,flip=false,remaining={w:600000,b:600000},inc=5000,running=false,last=0,ended=false;function finish(s){running=false;ended=true;$('status').textContent=s;clocks()}function tick(){if(running){const now=performance.now(),c=game.turn();remaining[c]=Math.max(0,remaining[c]-(now-last));last=now;if(!remaining[c])finish('کات تەواو بوو — '+(c==='w'?'ڕەش':'سپی')+' براوەیە (نموونە)')}clocks()}function clocks(){for(const c of ['w','b']){const n=Math.ceil(remaining[c]/1000);$(c).textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0');$(c).classList.toggle('active',running&&game.turn()===c)}}function render(){const targets=selected?game.moves({square:selected,verbose:true}).map(m=>m.to):[];$('board').replaceChildren();for(let i=0;i<64;i++){const j=flip?63-i:i,r=Math.floor(j/8),f=j%8,s='abcdefgh'[f]+(8-r),p=game.get(s),b=document.createElement('button');b.className=((r+f)%2?'dark':'light')+(p?.color==='w'?' white':'')+(s===selected?' selected':'')+(targets.includes(s)?' target':'');b.textContent=p?pieces[p.type]:'';b.setAttribute('aria-label',s);b.onclick=()=>{if(!running||ended)return;tick();if(!running)return;if(selected&&targets.includes(s)){const from=selected,c=game.turn();let promotion='q';if(game.get(from)?.type==='p'&&/[18]$/.test(s)){promotion=(prompt('Promotion: q / r / b / n','q')||'q').toLowerCase();if(!['q','r','b','n'].includes(promotion))return;}tick();if(!running)return;const m=game.move({from,to:s,promotion});if(m){remaining[c]+=inc;selected=null;last=performance.now();if(game.in_checkmate())finish('شابەند بوو — '+(c==='w'?'سپی':'ڕەش')+' براوەیە');else if(game.game_over())finish('یەکسانی');else $('status').textContent=game.in_check()?'شاپەنگ':game.turn()==='w'?'نۆرەی سپی':'نۆرەی ڕەش';}}else selected=p?.color===game.turn()?s:null;render();clocks()};$('board').append(b)}}$('start').onclick=()=>{game.reset();selected=null;ended=false;const [m,i]=$('time').value.split('+').map(Number);remaining={w:m*60000,b:m*60000};inc=i*1000;running=true;last=performance.now();$('status').textContent='نۆرەی سپی';render();clocks()};$('flip').onclick=()=>{flip=!flip;render()};$('resign').onclick=()=>{if(running&&confirm('واز دەهێنیت؟'))finish((game.turn()==='w'?'ڕەش':'سپی')+' براوەیە')};setInterval(tick,200);render();clocks();}
</script></html>
